name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run build:site
      - run: npm run build:library
      - run: npm run test:site
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
      - name: Upload website
        if: github.event_name != 'pull_request' && github.repository == 'metinweb/studio-editor' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  browsers:
    name: Browser tests (${{ matrix.browser }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            shard: 1/1
          - browser: firefox
            shard: 1/1
          - browser: webkit
            shard: 1/4
          - browser: webkit
            shard: 2/4
          - browser: webkit
            shard: 3/4
          - browser: webkit
            shard: 4/4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }} --workers=1 --timeout=60000 --max-failures=3 --reporter=list
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results-${{ strategy.job-index }}-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.repository == 'metinweb/studio-editor' && github.ref == 'refs/heads/main'
    needs: [checks, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested site
        id: deployment
        uses: actions/deploy-pages@v5
