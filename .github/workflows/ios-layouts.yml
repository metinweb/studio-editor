name: iOS keyboard layout names (temporary)

on:
  push:
    paths: ['.github/workflows/ios-layouts.yml']

permissions:
  contents: read

jobs:
  layouts:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Search the iOS runtime for keyboard layout names
        run: |
          ROOT=$(xcrun simctl list runtimes --json | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS']; print(r[-1]['runtimeRoot'])")
          LIB="$ROOT/System/Library"
          cd "$LIB"
          plutil -p TextInput/TextInput_tr.bundle/InputMode_tr.plist
          plutil -p TextInput/TextInput_tr.bundle/Keyboard-tr.plist | head -60
          plutil -p TextInput/TextInput_ja.bundle/InputMode_ja.plist | head -60
          for binary in PrivateFrameworks/TextInputCore.framework/TextInputCore PrivateFrameworks/UIKitCore.framework/UIKitCore PrivateFrameworks/TextInput.framework/TextInput; do
            echo "== $binary"
            strings -a "$binary" | grep -E '(Turkish|tr_TR|tr@sw)' | sort -u | head -40
          done
