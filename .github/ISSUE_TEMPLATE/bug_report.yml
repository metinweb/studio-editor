name: Bug report
description: Report a reproducible issue in Studio Editor
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal example without private documents or credentials.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system and version or commit
    validations:
      required: true
